name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json. Before
      # setup-node, so its pnpm cache can find the store.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The same gates as CI: a tag pushed from a commit that never went
      # through CI must not reach npm.
      - name: Run the checks
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Check the published package
        run: pnpm check:package

      # The browser checks, as in CI: the official-tools comparison, the hard
      # cases and the panel end to end. A release must pass them, not only a PR.
      - name: Browser checks
        run: pnpm check:browser

      # blix-site reads CHANGELOG.md from the repository and takes every `## `
      # heading for a release: a leftover `[Unreleased]` would show on the site
      # as the newest version, and a version with no heading of its own would
      # show nothing for it.
      - name: Verify the CHANGELOG has this version and no Unreleased section
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${TAG_VERSION//./\\.}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$TAG_VERSION]' heading in CHANGELOG.md"
            exit 1
          fi
          if grep -qE "^## \[Unreleased\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md still has an [Unreleased] section"
            exit 1
          fi

      # Without this, pushing tag v0.2.0 while package.json still says 0.1.0
      # republishes 0.1.0 silently (or fails opaquely on a duplicate version).
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag and package.json agree on $PKG_VERSION"

      - name: Publish
        run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Pushing the tag publishes to npm but leaves the Releases page untouched —
      # every release through v0.6.1 was filled in by hand, and v0.7.0 was missed
      # because of it. This runs last because npm is the step that cannot be taken
      # back: a release created before a failed publish would advertise a version
      # nobody can install.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # A CHANGELOG section runs from its "## [x.y.z] - date" heading to the
          # next "## [" — that body is the release notes, already written. Matched
          # by prefix rather than regex: the pattern crosses YAML, then the shell,
          # then awk, and a bracket escaped for all three survives none of them.
          awk -v h="## [$VERSION]" '
            index($0, h) == 1                { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            echo "::warning::No CHANGELOG section for $VERSION — falling back to commit-generated notes"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
