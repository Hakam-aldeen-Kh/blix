name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Bundles dist/ the way a consumer's production build does and evaluates
      # it with no `process` global — see scripts/check-prod-guard.mjs.
      - name: Check the production guard
        run: pnpm check:prod-guard

      # Builds a real AxiosError holding credentials and asserts none of them
      # reaches a stored entry — see scripts/check-redaction.mjs.
      - name: Check redaction
        run: pnpm check:redaction

      # Blocked storage, corrupt stored prefs and a render error inside the
      # panel must all leave the host app standing — see
      # scripts/check-isolation.mjs.
      - name: Check isolation from the host app
        run: pnpm check:isolation

      # Runs the generated "Copy as cURL" text in bash, with curl stubbed, for
      # a request made of shell-injection attempts — see
      # scripts/check-snippets.mjs.
      - name: Check copied snippets are shell-safe
        run: pnpm check:snippets

      # The consuming app's bundler substitutes NODE_ENV at *its* build time,
      # which is what drops the panel from production. If our build defined or
      # replaced it, the panel would ship to every consumer's users.
      - name: Verify process.env.NODE_ENV survived the build
        run: |
          if ! grep -qF 'process.env.NODE_ENV' dist/index.js; then
            echo "::error file=dist/index.js::process.env.NODE_ENV is missing from dist/index.js — the production guard was defined away at build time"
            exit 1
          fi

      # esbuild keeps the directive only at the top of an entry file. Without
      # it a React Server Component rendering <Blix /> fails in Next.js.
      - name: Verify the "use client" directive survived the build
        run: |
          if [ "$(head -c 12 dist/index.js)" != '"use client"' ]; then
            echo "::error file=dist/index.js::dist/index.js does not start with \"use client\""
            exit 1
          fi
